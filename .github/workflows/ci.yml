name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record host and toolchain
        run: uname -a && rustc -Vv
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check -p sdm-runtime --locked
      - run: cargo check -p sdm-runtime --examples --locked
      - run: cargo tree -p sdm-runtime --locked
      - name: Capture runtime benchmark
        run: cargo run -p sdm-runtime --example benchmark -- fixtures/benchmark-rank-request.json artifacts/compatibility-rank-v1.json > benchmark-${{ matrix.name }}.json
      - name: Capture nonlinear runtime benchmark
        run: cargo run -p sdm-runtime --example benchmark_nonlinear -- > nonlinear-benchmark-${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.name }}
          path: |
            benchmark-${{ matrix.name }}.json
            nonlinear-benchmark-${{ matrix.name }}.json
