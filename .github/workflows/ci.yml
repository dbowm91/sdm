name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Verify declared MSRV
        run: rustc -Vv && cargo fmt --all -- --check && cargo test --workspace --all-features --locked && cargo clippy --workspace --all-targets --all-features --locked -- -D warnings && cargo check -p sdm-runtime --locked
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Record host and toolchain
        run: uname -a && rustc -Vv
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check -p sdm-runtime --locked
      - run: cargo check -p sdm-runtime --examples --locked
      - run: cargo tree -p sdm-runtime --locked
      - name: Check frozen v1 consumer compatibility
        run: cargo run -q -p sdm-training --bin sdm-check-compat --locked -- fixtures/codegg-compatibility-v1.jsonl artifacts/compatibility-rank-v1.json
      - name: Run standalone Rank experiments end to end
        run: |
          mkdir -p target/experiments
          cargo run -p sdm-experiment --locked -- experiment run --config fixtures/standalone-rank-linear.experiment.json
          cargo run -p sdm-experiment --locked -- experiment run --config fixtures/standalone-rank-nonlinear.experiment.json
          cargo run -p sdm-experiment --locked -- experiment run --config fixtures/standalone-typed-rank.experiment.json
          cargo run -p sdm-experiment --locked -- experiment run --config fixtures/synthetic-binary-typed-v1.experiment.json
          cargo run -p sdm-experiment --locked -- experiment run --config fixtures/synthetic-choice-typed-v1.experiment.json
          cargo run -p sdm-experiment --locked -- experiment run --config fixtures/synthetic-score-typed-v1.experiment.json
      - name: Train and reload the additive compositional Choice architecture
        run: |
          mkdir -p target/m014
          cargo run -q -p sdm-experiment --locked -- experiment run --config fixtures/m014-compositional-choice.experiment.json > target/m014/choice-compositional.stdout.json
      - name: Regenerate M014 data and certify support before held-out inference
        run: |
          mkdir -p target/m014
          python3 scripts/generate_m014_synthetic_suite.py > target/m014/generator.stdout.json
          cargo run -q -p sdm-data --bin sdm-dataset --locked -- split target/m014/binary.json 140014 target/m014/binary.split.json --test-family m014-binary-id-a-v1 --test-family m014-binary-id-b-v1 --test-family m014-binary-text-shift-v1 --test-family m014-binary-combined-shift-v1 --test-family m014-binary-load-shift-v1 --test-family m014-binary-unknown-vocab-v1
          cargo run -q -p sdm-data --bin sdm-dataset --locked -- split target/m014/choice.json 140014 target/m014/choice.split.json --test-family m014-choice-id-a-v1 --test-family m014-choice-id-b-v1 --test-family m014-choice-text-shift-v1 --test-family m014-choice-combined-shift-v1 --test-family m014-choice-load-shift-v1 --test-family m014-choice-unknown-vocab-v1
          cmp fixtures/m014-binary-v1.split.json target/m014/binary.split.json
          cmp fixtures/m014-choice-v1.split.json target/m014/choice.split.json
          python3 scripts/validate_future_support.py --dataset target/m014/binary.json --split target/m014/binary.split.json --task binary --required-family m014-binary-id-a-v1 --required-family m014-binary-id-b-v1 --required-family m014-binary-text-shift-v1 --required-family m014-binary-combined-shift-v1 --required-family m014-binary-load-shift-v1 --required-family m014-binary-unknown-vocab-v1 --out target/m014/binary-support.json
          python3 scripts/validate_future_support.py --dataset target/m014/choice.json --split target/m014/choice.split.json --task choice --required-family m014-choice-id-a-v1 --required-family m014-choice-id-b-v1 --required-family m014-choice-text-shift-v1 --required-family m014-choice-combined-shift-v1 --required-family m014-choice-load-shift-v1 --required-family m014-choice-unknown-vocab-v1 --out target/m014/choice-support.json
          mkdir -p target/m014/candidates-v2
          for config in m014-binary-baseline m014-binary-mask m014-binary-mask-l2 m014-choice-legacy m014-choice-cross m014-choice-compositional; do
            cargo run -q -p sdm-experiment --locked -- experiment run --config "fixtures/${config}.experiment.json" > "target/m014/candidates-v2/${config}.stdout.json"
          done
          python3 scripts/verify_m014_freeze.py
      - name: Run M011 generated held-out suites
        run: |
          mkdir -p target/m011-v2
          python3 scripts/generate_m011_synthetic_suite.py
          git diff --exit-code -- fixtures/m011-v2-binary.json fixtures/m011-v2-choice.json fixtures/m011-v2-score.json fixtures/m011-v2-rank.json
          cargo run -q -p sdm-data --bin sdm-dataset --locked -- split fixtures/m011-v2-binary.json 11012 target/m011-v2/binary.split.json --exclude-family m011-binary-excluded-v2 --test-family m011-binary-ood-v2
          cargo run -q -p sdm-data --bin sdm-dataset --locked -- split fixtures/m011-v2-choice.json 11012 target/m011-v2/choice.split.json --exclude-family m011-choice-excluded-v2 --test-family m011-choice-ood-v2
          cargo run -q -p sdm-data --bin sdm-dataset --locked -- split fixtures/m011-v2-score.json 11012 target/m011-v2/score.split.json --exclude-family m011-score-excluded-v2 --test-family m011-score-ood-v2
          cargo run -q -p sdm-data --bin sdm-dataset --locked -- split fixtures/m011-v2-rank.json 11012 target/m011-v2/rank.split.json --exclude-family m011-rank-excluded-v2 --test-family m011-rank-ood-v2
          cmp fixtures/m011-v2-binary.split.json target/m011-v2/binary.split.json
          cmp fixtures/m011-v2-choice.split.json target/m011-v2/choice.split.json
          cmp fixtures/m011-v2-score.split.json target/m011-v2/score.split.json
          cmp fixtures/m011-v2-rank.split.json target/m011-v2/rank.split.json
          cargo run -q -p sdm-experiment --locked -- experiment run --config fixtures/m011-v2-binary.experiment.json > target/m011-v2/binary.stdout.json
          cargo run -q -p sdm-experiment --locked -- experiment run --config fixtures/m011-v2-choice.experiment.json > target/m011-v2/choice.stdout.json
          cargo run -q -p sdm-experiment --locked -- experiment run --config fixtures/m011-v2-score.experiment.json > target/m011-v2/score.stdout.json
          cargo run -q -p sdm-experiment --locked -- experiment run --config fixtures/m011-v2-rank.experiment.json > target/m011-v2/rank.stdout.json
          cargo run -q -p sdm-experiment --locked -- experiment run --config fixtures/m011-v2-rank-linear.experiment.json > target/m011-v2/rank-linear.stdout.json
          cargo run -q -p sdm-experiment --locked -- experiment run --config fixtures/m011-v2-rank-nonlinear.experiment.json > target/m011-v2/rank-nonlinear.stdout.json
          cargo metadata --locked --format-version 1 > target/m011-v2/cargo-metadata.json
          python3 scripts/audit_cargo_licenses.py target/m011-v2/cargo-metadata.json target/m011-v2/license-audit.json
          python3 scripts/analyze_m011_qualification.py
      - name: Preserve exact M011 report identities on Linux x86_64
        if: matrix.name == 'linux-x64'
        run: python3 scripts/check_m011_frozen_reports.py
      - name: Freeze and qualify M013a independent quality suites
        run: |
          mkdir -p target/m013a
          python3 scripts/generate_m013a_quality_suite.py
          git diff --exit-code -- fixtures/m013a-binary-v1.json fixtures/m013a-choice-v1.json
          cargo run -q -p sdm-data --bin sdm-dataset --locked -- split fixtures/m013a-binary-v1.json 14014 target/m013a/binary.split.json --test-family m013a-binary-load-shift-v1 --test-family m013a-binary-text-shift-v1 --test-family m013a-binary-combined-shift-v1
          cargo run -q -p sdm-data --bin sdm-dataset --locked -- split fixtures/m013a-choice-v1.json 14014 target/m013a/choice.split.json --test-family m013a-choice-load-shift-v1 --test-family m013a-choice-text-shift-v1 --test-family m013a-choice-combined-shift-v1
          cmp fixtures/m013a-binary-v1.split.json target/m013a/binary.split.json
          cmp fixtures/m013a-choice-v1.split.json target/m013a/choice.split.json
          python3 scripts/validate_m013a_freeze.py > target/m013a/freeze-validation.stdout.json
          cargo run -q -p sdm-experiment --locked -- experiment run --config fixtures/m013a-binary-v1.experiment.json > target/m013a/binary.stdout.json
          cargo run -q -p sdm-experiment --locked -- experiment run --config fixtures/m013a-choice-legacy-v1.experiment.json > target/m013a/choice-legacy.stdout.json
          cargo run -q -p sdm-experiment --locked -- experiment run --config fixtures/m013a-choice-cross-v1.experiment.json > target/m013a/choice-cross.stdout.json
          python3 scripts/analyze_m013a_quality.py > target/m013a/quality-analysis.stdout.json
      - name: Verify M013b evaluation-integrity evaluator
        if: hashFiles('target/m013a/*.report.json') != ''
        run: |
          # The scripts create this directory atomically, but the shell
          # redirections below are evaluated first, so create it up front.
          mkdir -p target/m013b
          # Unit tests run against constructed fixtures only: no training, no
          # held-out model-selection loop, no M013a test feedback.
          python3 -m unittest discover -s scripts -p 'test_m013b_*.py'
          # Read-only retrospective erratum over the unchanged saved reports.
          python3 scripts/m013b_audit_m013a.py > target/m013b/audit.stdout.json
          # Train/dev-only diagnostics; never selects a model.
          python3 scripts/m013b_diagnostics.py > target/m013b/diagnostics.stdout.json
          # Confirm the frozen M013a disposition is preserved verbatim.
          python3 - <<'PY'
          import json, pathlib, sys
          out = pathlib.Path("target/m013b")
          if not (out / "m013a-audit-erratum.json").exists():
              sys.exit("M013b audit sidecar missing")
          if not (out / "m013b-diagnostics.json").exists():
              sys.exit("M013b diagnostics missing")
          erratum = json.loads((out / "m013a-audit-erratum.json").read_text())
          assert erratum["frozen_inputs_modified"] is False
          assert erratum["retained_disposition"]["binary"].startswith("negative")
          assert erratum["retained_disposition"]["choice"].startswith("indeterminate")
          assert erratum["gate_verdicts"]["choice"]["verdict"] == "indeterminate"
          assert erratum["gate_verdicts"]["binary"]["verdict"] == "negative"
          diagnostics = json.loads((out / "m013b-diagnostics.json").read_text())
          assert diagnostics["evidence_policy"]["partitions_forbidden"] == ["test"]
          PY
      - name: Verify M013c qualification-gate hardening
        if: hashFiles('target/m013a/*.report.json') != ''
        run: |
          # Same staging caveat as the M013b step: the shell redirections are
          # evaluated before any script creates the directory.
          mkdir -p target/m013c
          # Constructed fixtures only: no training, no held-out selection loop,
          # no M013a test feedback. These fail if a mandatory gate can be
          # skipped, a critical n<minimum labels negative, a point mean
          # masquerades as a confidence interval, or a control is omitted.
          python3 -m unittest discover -s scripts -p 'test_m013c_*.py'
          # Read-only retrospective gate-semantics correction over the unchanged
          # saved reports. Writes only target/m013c/.
          python3 scripts/m013c_qualification_audit.py > target/m013c/audit.stdout.json
          python3 - <<'PY'
          import json, pathlib, sys
          out = pathlib.Path("target/m013c")
          audit_path = out / "m013c-decision-audit.json"
          if not audit_path.exists():
              sys.exit("M013c decision audit sidecar missing")
          audit = json.loads(audit_path.read_text())
          assert audit["frozen_inputs_modified"] is False, "M013c must not modify frozen inputs"
          # Historical dispositions must survive the hardening unchanged.
          assert audit["retained_disposition"]["binary"] == "negative", audit["retained_disposition"]
          assert audit["retained_disposition"]["choice"] == "indeterminate", audit["retained_disposition"]
          assert audit["retained_disposition"]["binary_verdict_unchanged"] is True
          assert audit["retained_disposition"]["choice_verdict_unchanged"] is True
          # No gate may reach a supported critical negative below its minimum support.
          minimum = audit["declared_required_sets"]["binary"]["minimum_independent_groups"]
          for gate in audit["gate_verdicts"]["binary"]["gates"]:
              if gate["status"] == "fail" and gate["critical"]:
                  assert gate["evidence_count"] >= gate["minimum_group_support"] == minimum, gate
          # Every declared negative control is measured, never replaced or dropped.
          controls = audit["declared_required_sets"]
          measured = {
              gate["name"].split("::")[-1]
              for gate in audit["gate_verdicts"]["choice"]["gates"]
              if gate["name"].startswith("negative_control::measured::")
          }
          assert len(measured) == 5, f"expected 5 measured controls, got {sorted(measured)}"
          assert controls["choice_required_ood_families"], "required OOD families must be enumerated"
          PY
      - name: Replay pinned M013c provenance for M013d comparison
        if: hashFiles('target/m013a/*.report.json') != ''
        run: |
          mkdir -p target/m013d
          git worktree add --detach target/m013d/reference 03c4a982219ffa830b7c0aba9dbb19a541cae56c
          mkdir -p target/m013d/reference/target/m013a target/m013d/reference/target/m013b target/m013d/reference/target/m013c
          cp -R target/m013a/. target/m013d/reference/target/m013a/
          python3 target/m013d/reference/scripts/analyze_m013a_quality.py > target/m013d/reference/target/m013a/quality-analysis.stdout.json
          python3 target/m013d/reference/scripts/m013b_audit_m013a.py > target/m013d/reference/target/m013b/audit.stdout.json
          python3 target/m013d/reference/scripts/m013b_diagnostics.py > target/m013d/reference/target/m013b/diagnostics.stdout.json
          python3 target/m013d/reference/scripts/m013c_qualification_audit.py > target/m013d/reference/target/m013c/audit.stdout.json
          python3 scripts/m013d_provenance_audit.py --old-commit 03c4a982219ffa830b7c0aba9dbb19a541cae56c --old-root target/m013d/reference --new-commit "$GITHUB_SHA" --allow-host-specific-hashes
          python3 - <<'PY'
          import json, pathlib
          audit = json.loads(pathlib.Path("target/m013d/bootstrap-provenance-audit.json").read_text())
          assert audit["historical_preserved"] is True
          assert audit["model_qualifications_unchanged"] is True
          assert audit["semantic_comparison"]["verdicts_unchanged"] is True
          assert audit["semantic_comparison"]["m013a_and_diagnostics_host_outputs_identical"] is True
          PY
      - name: Verify M013d bootstrap percentile repair
        if: hashFiles('target/m013a/*.report.json') != ''
        run: python3 -m unittest discover -s scripts -p 'test_m013d_*.py'
      - name: Verify M014 representability proof (pure, no canary artifacts)
        run: |
          # Pure unit tests only: no target/m014a/canary/* dependency.
          # Explicit file patterns (never the broad test_m014_*.py wildcard,
          # which also matches artifact-backed test_m014a_canary.py and
          # reproduces hosted run 38408167153 on clean checkouts).
          python3 -m unittest discover -s scripts -p 'test_m014_representability.py'
          python3 -m unittest discover -s scripts -p 'test_m014_suite.py'
          python3 -m unittest discover -s scripts -p 'test_m014a_analyzer.py'
      - name: Verify M015a v2 contract (pure, no artifacts)
        run: |
          # Pure final-action/pair/support unit tests: no target/m015* dependency.
          # Must precede baseline generation for pure->generator->dependent order.
          python3 -m unittest discover -s scripts -p 'test_m015a_final.py'
          test -f docs/m015a-evaluation-erratum.md
          test -f scripts/m015a_final_metrics.py
          test -f scripts/analyze_m015a_final_actions.py
      - name: Verify M015 TRAIN/DEV generator and oracle (no final partition)
        run: |
          python3 -m unittest discover -s scripts -p 'test_m015_*.py'
          python3 scripts/generate_m015_suite.py --out target/m015 --groups 2000 --seed 150015 > target/m015-generator.json
          python3 scripts/analyze_m015_dev.py --train target/m015/train.jsonl --dev target/m015/dev.jsonl --out target/m015/dev-report.json > target/m015-dev-analysis.stdout.json
          python3 - <<'PY'
          import json
          report = json.load(open('target/m015/dev-report.json'))
          assert report['oracle_disagreements'] == 0
          assert report['dev_groups'] == 200
          assert report['partition'] == 'DEV only'
          assert 'run by scripts/run_m015_baselines.py' in report['learned_baselines']['typed_cross']
          assert all(s['answerable_groups'] > 0 and s['no_answer_groups'] > 0 for s in report['answerability_by_family'].values())
      - name: Run existing M015 Choice baselines (TRAIN/DEV only)
        if: matrix.name == 'linux-x64'
        run: |
          python3 scripts/run_m015_baselines.py --out target/m015-baselines --groups 2000 --seed 150015 > target/m015-baselines.stdout.json
          python3 - <<'PY'
          import json
          summary = json.load(open('target/m015-baselines/baseline-summary.json'))
          assert summary['mode'] == 'TRAIN/DEV only'
          assert set(summary['models']) == {'typed-choice', 'typed-choice-cross', 'typed-choice-compositional'}
          for model in summary['models'].values():
              assert model['test_evaluation_performed'] is False
              assert model['verdict'] == 'train-dev-only'
              assert model['metrics']['dev_answerable_accuracy_group_bootstrap_95_ci_lower'] <= model['metrics']['dev_answerable_accuracy']
              assert model['metrics']['dev_answerable_accuracy_group_bootstrap_95_ci_upper'] >= model['metrics']['dev_answerable_accuracy']
          PY
      - name: Replay M015a DEV final actions (TRAIN/DEV only, no FINAL)
        if: matrix.name == 'linux-x64'
        run: |
          # Dependent DEV-only replay over the just-built TRAIN/DEV baselines.
          # Never trains, never evaluates test, never rewrites history; outputs
          # only target/m015a/. Fails closed on census/SHA/support drift.
          python3 scripts/analyze_m015a_final_actions.py \
            --corpus-train target/m015-baselines/corpus/train.jsonl \
            --corpus-dev target/m015-baselines/corpus/dev.jsonl \
            --typed-dataset target/m015-baselines/typed-choice.json \
            --typed-split target/m015-baselines/typed-choice.split.json \
            --artifacts-dir target/m015-baselines \
            --reports-dir target/m015-baselines \
            --out target/m015a > target/m015a-summary.stdout.json
          python3 - <<'PY'
          import json, pathlib
          summary = json.load(open('target/m015a/m015a-summary.json'))
          assert summary['partition'] == 'DEV only'
          assert summary['test_evaluation_performed'] is False
          assert summary['census']['dev_rows'] == 720
          assert summary['census']['dev_groups'] == 200
          assert summary['census']['dev_nuisance_pairs'] == 200
          assert summary['census']['dev_causal_pairs'] == 160
          for arch, model in summary['models'].items():
              v = model['v2']
              # Raw ranking stays perfect; final answerable drops to 2/3 with
              # 1/3 false abstention; causal both-final is 0 (impossibility).
              assert v['dev_conditional_argmax_accuracy_v2']['value'] == 1.0, (arch, v)
              assert abs(v['dev_answerable_final_accuracy_v2']['value'] - 2/3) < 1e-9, (arch, v)
              assert abs(v['dev_false_abstention_rate_v2']['value'] - 1/3) < 1e-9, (arch, v)
              assert abs(v['dev_answerable_final_coverage_v2']['value'] - 2/3) < 1e-9, (arch, v)
              assert v['causal_both_final_correct']['value'] == 0.0, (arch, v)
              assert v['nuisance_both_final_correct']['value'] == 1.0, (arch, v)
              # Legacy mixed values are preserved for comparison, not promoted.
              assert model['legacy_mixed']['dev_answerable_accuracy'] == 1.0
              assert model['legacy_mixed']['dev_counterfactual_correct_on_both'] == 1.0
          print("M015a DEV replay verified: raw 1.0, final answerable 2/3, causal both-final 0.0")
          PY
          test -f target/m015a/typed-choice.sidecar.json
          test -f target/m015a/typed-choice-cross.sidecar.json
          test -f target/m015a/typed-choice-compositional.sidecar.json
      - name: Enforce M015a CI ordering (regression)
        run: python3 scripts/check_m015a_ci_order.py
      - name: Run M016 TinyMLP comparison (TRAIN/DEV only, release)
        if: matrix.name == 'linux-x64'
        run: |
          # Bounded 36-config grid + three legacy heads + isolated tree +
          # v2 replays + paired diffs. Never trains/evaluates test/FINAL.
          python3 scripts/run_m016_comparison.py --out target/m016 --epochs 20 > target/m016-stdout.json
          python3 - <<'PY'
          import json, hashlib, pathlib
          comp = json.load(open('target/m016/m016-comparison.json'))
          assert comp['partition'] == 'DEV only', comp['partition']
          assert comp['test_evaluation_performed'] is False
          assert comp['grid_size'] == 36, comp['grid_size']
          assert comp['build_profile'] == 'release', comp.get('build_profile')
          assert set(comp['models']) == {'typed-choice', 'typed-choice-cross', 'typed-choice-compositional', 'typed-choice-tinymlp', 'tree'}, set(comp['models'])
          tiny = comp['models']['typed-choice-tinymlp']
          assert tiny['dev_conditional_argmax_accuracy_v2'] == 1.0, tiny
          assert tiny['dev_false_abstention_rate_v2'] <= 1/3, tiny
          # Byte-exact reproducibility: the hosted release run must reproduce
          # the committed selected artifact, or fail (explicit re-freeze needed).
          rep = json.load(open('target/m016/train/m016-train-report.json'))
          art = pathlib.Path(rep['selected_artifact_path'])
          fixture = pathlib.Path('fixtures/m016-tinymlp-selected.artifact.json')
          got = 'sha256:' + hashlib.sha256(art.read_bytes()).hexdigest()
          want = 'sha256:' + hashlib.sha256(fixture.read_bytes()).hexdigest()
          assert got == want, f'M016 selected bytes drift: {got} != {want}'
          assert comp['disposition'] in ('positive-dev-only', 'needs-review'), comp['disposition']
          print('M016 comparison verified: disposition=' + comp['disposition'])
          PY
      - name: Upload M016 evidence (always, for fixture audit)
        if: matrix.name == 'linux-x64' && always()
        uses: actions/upload-artifact@v4
        with:
          name: m016-evidence-${{ matrix.name }}
          path: |
            target/m016/m016-comparison.json
            target/m016/m016-train-spec.json
            target/m016/tree-report.json
            target/m016/tree-baseline.json
            target/m016/typed-choice-tinymlp.sidecar.json
            target/m016/typed-choice.sidecar.json
            target/m016/train/m016-train-report.json
            target/m016/train/tinymlp-*.artifact.json
            target/m016-stdout.json
      - name: Verify M017 unit contracts (pure, no cohort inference)
        run: |
          python3 -m unittest discover -s scripts -p 'test_m017_freeze.py'
          python3 -m unittest discover -s scripts -p 'test_m017_analyze.py'
      - name: Verify M017 freeze (regenerate cohorts, no final inference)
        run: |
          python3 scripts/verify_m017_freeze.py --out target/m017-freeze-verify.json
          test "$(python3 -c "import json; print(json.load(open('target/m017-freeze-verify.json'))['ok'])")" = "True"
      - name: Run M017 canary inference (public cohort, same committed bytes)
        run: |
          case "${{ matrix.name }}" in
            linux-x64) PLATFORM=linux-x86_64 ;;
            linux-arm64) PLATFORM=linux-aarch64 ;;
            macos-arm64) PLATFORM=macos-aarch64 ;;
            *) echo "unknown matrix ${{ matrix.name }}"; exit 1 ;;
          esac
          python3 scripts/run_m017_canary.py --out "target/m017-canary/attestation-${{ matrix.name }}.json" --platform "$PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: m017-canary-${{ matrix.name }}
          path: target/m017-canary/attestation-${{ matrix.name }}.json
      - name: Verify M016 same-artifact parity sample (all hosts)
        run: cargo test -p sdm-runtime --locked tinymlp_fixture_parity
      - name: Generate M014a DEV-CANARY (provision artifacts before dependent tests)
        run: |
          # Deterministically creates target/m014a/canary/* on every matrix host.
          # Must succeed before any artifact-backed test; fails the job otherwise.
          # Regenerates safely and only deletes its own DEV-CANARY artifacts;
          # NEVER removes M014b final or earlier M014 paths.
          python3 scripts/run_m014a_dev_canary.py
          test -f target/m014a/canary/qualification.json
          test -f target/m014a/canary/manifest.json
          test -f target/m014a/canary/resource-evidence.json
          python3 - <<'PY'
          import json
          qual = json.load(open('target/m014a/canary/qualification.json'))
          assert qual['binary_verdict'] == 'positive', qual['binary_reason']
          assert qual['choice_verdict'] == 'indeterminate', qual['choice_reason']
          assert qual['overall_verdict'] == 'indeterminate'
          print("M014a DEV-CANARY verified: Binary positive, Choice indeterminate, all gates present")
          PY
          echo "--- per-host canary evidence (source test vs workload distinguished) ---"
          git rev-parse HEAD
          rustc -Vv
          uname -a
          python3 - <<'PY'
          import json, hashlib, pathlib
          def fsha(p): return "sha256:"+hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          print("manifest:", fsha("target/m014a/canary/manifest.json"))
          print("qualification:", fsha("target/m014a/canary/qualification.json"))
          for n in ("eval-binary-mask","eval-binary-baseline","eval-choice-compositional","eval-choice-legacy","eval-choice-cross"):
              print(n, fsha(f"target/m014a/canary/{n}.report.json"))
          PY
      - name: Verify M014a artifact-backed canary tests (requires generated canary)
        run: python3 -m unittest discover -s scripts -p 'test_m014a_canary.py'
      - name: Enforce M014a CI ordering (regression)
        run: python3 scripts/check_m014a_ci_order.py
      - name: Verify M014c lineage (read-only, no final rerun)
        run: |
          mkdir -p target/m014c
          python3 scripts/verify_m014c_lineage.py --out target/m014c/lineage-verdict.json
          cat target/m014c/lineage-verdict.json
      - name: Generate M014c parity evaluations (SAME committed bytes on all hosts)
        run: |
          # Evaluates SAME committed artifacts/m014/* bytes on locally generated
          # (deterministic-identical) canary data. Canary-retrained Choice bytes
          # differ across OSes, so parity MUST use committed bytes (plan B2).
          # Outputs only target/m014a/canary/parity-*; never FINAL paths.
          python3 scripts/m014c_parity_evaluate.py
          ls -lh target/m014a/canary/parity-*.report.json
      - name: Generate M014c per-host canary attestation (same-artifact decisions)
        run: |
          mkdir -p target/m014a/canary target/m014c
          case "${{ matrix.name }}" in
            linux-x64) PLATFORM=linux-x86_64 ;;
            linux-arm64) PLATFORM=linux-aarch64 ;;
            macos-arm64) PLATFORM=macos-aarch64 ;;
            *) echo "unknown matrix ${{ matrix.name }}"; exit 1 ;;
          esac
          python3 scripts/m014c_canary_attestation.py --parity --platform "$PLATFORM" --out "target/m014a/canary/attestation-${{ matrix.name }}.json"
          test -f "target/m014a/canary/attestation-${{ matrix.name }}.json"
          python3 -c "import json; a=json.load(open('target/m014a/canary/attestation-${{ matrix.name }}.json')); print('parity_mode:', a.get('parity_mode'), 'binary:', a['binary_case_count'], 'choice:', a['choice_case_count']); assert a.get('parity_mode') is True"
      - name: Verify M014b prospective freeze (no final rerun)
        run: |
          # Regenerate M014b cohort deterministically and verify freeze SHAs,
          # support, and candidate loading WITHOUT running final inference
          # (one-time final already consumed locally; CI must not rerun it).
          python3 scripts/generate_m014b_suite.py > target/m014b-generator.json
          cargo run -q -p sdm-data --bin sdm-dataset --locked -- split target/m014b/binary.json 140142 target/m014b/binary.split.json --test-family m014b-binary-id-a-v1 --test-family m014b-binary-id-b-v1 --test-family m014b-binary-text-shift-v1 --test-family m014b-binary-combined-shift-v1 --test-family m014b-binary-load-shift-v1 --test-family m014b-binary-unknown-vocab-v1
          cargo run -q -p sdm-data --bin sdm-dataset --locked -- split target/m014b/choice.json 140142 target/m014b/choice.split.json --test-family m014b-choice-id-a-v1 --test-family m014b-choice-id-b-v1 --test-family m014b-choice-text-shift-v1 --test-family m014b-choice-combined-shift-v1 --test-family m014b-choice-load-shift-v1 --test-family m014b-choice-unknown-vocab-v1
          cmp fixtures/m014b-binary-v1.split.json target/m014b/binary.split.json
          cmp fixtures/m014b-choice-v1.split.json target/m014b/choice.split.json
          python3 scripts/validate_future_support.py --dataset target/m014b/binary.json --split target/m014b/binary.split.json --task binary --required-family m014b-binary-id-a-v1 --required-family m014b-binary-id-b-v1 --required-family m014b-binary-text-shift-v1 --required-family m014b-binary-combined-shift-v1 --required-family m014b-binary-load-shift-v1 --required-family m014b-binary-unknown-vocab-v1 --out target/m014b/binary-support.json
          python3 scripts/validate_future_support.py --dataset target/m014b/choice.json --split target/m014b/choice.split.json --task choice --required-family m014b-choice-id-a-v1 --required-family m014b-choice-id-b-v1 --required-family m014b-choice-text-shift-v1 --required-family m014b-choice-combined-shift-v1 --required-family m014b-choice-load-shift-v1 --required-family m014b-choice-unknown-vocab-v1 --out target/m014b/choice-support.json
          python3 - <<'PY'
          import json, hashlib, pathlib
          def file_sha(p): return "sha256:"+hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          freeze = json.loads(pathlib.Path("docs/m014b-freeze-v1.json").read_text())
          assert file_sha(pathlib.Path("scripts/generate_m014b_suite.py")) == freeze["generator_sha256"], "generator SHA mismatch"
          assert file_sha(pathlib.Path("docs/m014b-protocol-v1.json")) == freeze["protocol_sha256"], "protocol SHA mismatch"
          assert file_sha(pathlib.Path("scripts/qualify_semantic_v2.py")) == freeze["evaluator_sha256"], "evaluator SHA mismatch"
          assert file_sha(pathlib.Path("target/m014b/binary.json")) == freeze["datasets"]["target/m014b/binary.json"], "binary dataset SHA mismatch"
          assert file_sha(pathlib.Path("target/m014b/choice.json")) == freeze["datasets"]["target/m014b/choice.json"], "choice dataset SHA mismatch"
          for rel, expected in freeze["final_configs"].items():
              assert file_sha(pathlib.Path(rel)) == expected, f"final config {rel} SHA mismatch"
          print("M014b freeze verified (no final rerun); support pass; candidates load via evaluate SHA checks (final already consumed, do not rerun).")
          PY
      - name: Capture runtime benchmark
        run: cargo run -p sdm-runtime --example benchmark -- fixtures/benchmark-rank-request.json artifacts/compatibility-rank-v1.json > benchmark-${{ matrix.name }}.json
      - name: Capture nonlinear runtime benchmark
        run: cargo run -p sdm-runtime --example benchmark_nonlinear -- target/experiments/nonlinear.artifact.json > nonlinear-benchmark-${{ matrix.name }}.json
      - name: Compile public standalone library consumer
        run: cargo check --manifest-path examples/standalone-consumer/Cargo.toml --locked
      - name: Verify release metadata, package contents, and license inventory
        run: |
          # Verify the consumer against all freshly extracted workspace packages
          # below; Cargo's per-crate registry verification would resolve the
          # already published 0.1.0 sdm-runtime while the staged workspace uses
          # the new cross-choice constructor that has not been published yet.
          cargo package --workspace --locked --no-verify
          cargo package --workspace --locked --list > target/package-list.txt
          python3 scripts/audit_package_contents.py target/package-files.json
          diff -u docs/package-files.json target/package-files.json
          python3 scripts/check_staged_consumer.py
          cargo metadata --locked --format-version 1 > target/cargo-metadata.json
          python3 scripts/audit_cargo_licenses.py target/cargo-metadata.json target/third-party-license-inventory.json
          diff -u docs/third-party-license-inventory.json target/third-party-license-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.name }}
          path: |
            benchmark-${{ matrix.name }}.json
            nonlinear-benchmark-${{ matrix.name }}.json
            target/experiments/
            target/m011-v2/
            target/m013a/
            target/m014/
            target/m014a/
            target/m014b/
            target/m015/
            target/m015-baselines/
            target/m016/
            target/m013b/
            target/m013c/
      - uses: actions/upload-artifact@v4
        with:
          name: canary-attestation-${{ matrix.name }}
          path: target/m014a/canary/attestation-${{ matrix.name }}.json
  canary-parity:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: canary-attestation-linux-x64
          path: parity-inputs/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: canary-attestation-linux-arm64
          path: parity-inputs/linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: canary-attestation-macos-arm64
          path: parity-inputs/macos-arm64
      - name: Verify three-host same-artifact parity (M014c B3)
        run: |
          ls -R parity-inputs
          mkdir -p target/m014c
          python3 scripts/verify_m014c_parity.py \
            --inputs parity-inputs/linux-x64/attestation-linux-x64.json parity-inputs/linux-arm64/attestation-linux-arm64.json parity-inputs/macos-arm64/attestation-macos-arm64.json \
            --out target/m014c/parity-verdict.json
          cat target/m014c/parity-verdict.json
      - uses: actions/upload-artifact@v4
        with:
          name: canary-parity-verdict
          path: target/m014c/parity-verdict.json
  m017-canary-parity:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: m017-canary-linux-x64
          path: canary-inputs/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: m017-canary-linux-arm64
          path: canary-inputs/linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: m017-canary-macos-arm64
          path: canary-inputs/macos-arm64
      - name: Verify three-host same-artifact canary parity (M017 H)
        run: |
          ls -R canary-inputs
          mkdir -p target/m017c
          python3 scripts/verify_m017_canary_parity.py \
            --inputs canary-inputs/linux-x64/attestation-linux-x64.json canary-inputs/linux-arm64/attestation-linux-arm64.json canary-inputs/macos-arm64/attestation-macos-arm64.json \
            --out target/m017c/parity-verdict.json
          cat target/m017c/parity-verdict.json
      - uses: actions/upload-artifact@v4
        with:
          name: m017-canary-parity-verdict
          path: target/m017c/parity-verdict.json
  portability:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-linux-x64
          path: shared-trained-artifact
      - name: Benchmark the identical Linux-trained artifact
        run: cargo run -p sdm-runtime --example benchmark_nonlinear -- shared-trained-artifact/target/experiments/nonlinear.artifact.json > trained-artifact-portability-${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: trained-artifact-portability-${{ matrix.name }}
          path: trained-artifact-portability-${{ matrix.name }}.json
  choice-portability:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record host and toolchain
        run: uname -a && rustc -Vv
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-linux-x64
          path: shared-trained-artifact
      - name: Benchmark identical trained Choice artifacts
        run: |
          cargo run -p sdm-runtime --example benchmark_typed_choice --locked -- shared-trained-artifact/target/m013a/choice-cross.artifact.json fixtures/m013a-choice-v1.json > typed-choice-cross-portability-${{ matrix.name }}.json
          cargo run -p sdm-runtime --example benchmark_typed_choice --locked -- artifacts/m014/choice-compositional-v1.artifact.json shared-trained-artifact/target/m014/choice.json > typed-choice-compositional-portability-${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: typed-choice-portability-${{ matrix.name }}
          path: typed-choice-*-portability-${{ matrix.name }}.json
