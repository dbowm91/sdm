[workspace]
resolver = "2"
members = ["crates/sdm-core", "crates/sdm-runtime", "crates/sdm-training"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
async-trait = "0.1"
