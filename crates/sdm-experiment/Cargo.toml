[package]
name = "sdm-experiment"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sdm-core = { path = "../sdm-core", version = "0.1.0" }
sdm-data = { path = "../sdm-data", version = "0.1.0" }
sdm-eval = { path = "../sdm-eval", version = "0.1.0" }
sdm-nonlinear = { path = "../sdm-nonlinear", version = "0.1.0", features = ["training"] }
sdm-runtime = { path = "../sdm-runtime", version = "0.1.0" }
sdm-training = { path = "../sdm-training", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[[bin]]
name = "sdm"
path = "src/main.rs"

[[example]]
name = "standalone_consumer"
path = "examples/standalone_consumer.rs"
