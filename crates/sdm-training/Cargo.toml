[package]
name = "sdm-training"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/sdm-training"
description = "Deterministic local training and compatibility tooling for SDM decision models."

[dependencies]
sdm-core = { path = "../sdm-core", version = "0.1.0" }
sdm-runtime = { path = "../sdm-runtime", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[[bin]]
name = "sdm-train"
path = "src/bin/sdm-train.rs"

[[bin]]
name = "sdm-check-compat"
path = "src/bin/sdm-check-compat.rs"
